[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autoreels"
version = "0.1.0"
description = "Product URL in, vertical Reel out. A Creatify-style short-video pipeline for Shopify stores."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
autoreels = "autoreels.cli:main"

[tool.setuptools.packages.find]
include = ["autoreels*"]

[tool.setuptools.package-data]
"autoreels.brand" = ["*.json"]
