name: Render the HyperFrames reel

# The Kumiko.Asanoha reel, rendered from the real product photography.
#
# This exists because the photos are the point and they are not always
# reachable. cdn.shopify.com is blocked from some environments, so the version
# built there falls back to a drawn lamp. A GitHub runner reaches the CDN, so
# here the real frames are used and no product photo is invented.
#
# No secrets. The image URLs are public CDN links already committed in
# examples/catalog/, so nothing needs a Shopify token.
#
# It runs on push because a workflow_dispatch button only appears once the
# workflow file is on the default branch. Merge it there and the button shows up.

on:
  push:
    branches: ['**']
    paths:
      - 'reels/**'
      - '.github/workflows/hyperframes-reel.yml'
  workflow_dispatch:
    inputs:
      product:
        description: Product handle (must exist in examples/catalog/)
        type: string
        required: true
        default: kumiko-asanoha

permissions:
  # write, so the run can push the contact sheet back for review. The
  # artifact blob host is unreachable from some environments; a committed
  # JPEG is reviewable from anywhere that can read the repo.
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: reels/kumiko-asanoha
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install FFmpeg
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -1
          ffprobe -version | head -1

      - name: Install Chrome Headless Shell
        run: npx --yes hyperframes@0.8.17 browser ensure

      - name: Fetch the real product photos
        run: python3 fetch_photos.py "${{ inputs.product || 'kumiko-asanoha' }}"

      - name: Build the photo cut
        run: python3 build_photos.py

      # Blocking. It passes clean against placeholder frames, so anything it
      # reports here is caused by the real photography - a crop that overflows
      # or text that loses contrast over a bright frame - and that is worth
      # knowing before the video ships, not after.
      - name: Check
        run: |
          set -o pipefail
          npx --yes hyperframes@0.8.17 check 2>&1 | tee check.log

      - name: Render
        run: npx --yes hyperframes@0.8.17 render -o kumiko-asanoha-photo.mp4

      - name: Contact sheet for review
        continue-on-error: true
        run: npx --yes hyperframes@0.8.17 snapshot --at 1.5,5.5,9.5,13.5,17.5

      - name: Report
        run: |
          ls -la kumiko-asanoha-photo.mp4
          ffprobe -v error -show_entries format=duration,size:stream=width,height,codec_name \
            -of default=noprint_wrappers=1 kumiko-asanoha-photo.mp4

      - name: Publish the contact sheet for review
        run: |
          mkdir -p review
          cp snapshots/contact-sheet.jpg review/
          cp check.log review/
          cd "$GITHUB_WORKSPACE"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f reels/kumiko-asanoha/review
          if git diff --cached --quiet; then
            echo "review output unchanged"
          else
            git commit -m "Publish the photo cut's contact sheet [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: kumiko-asanoha-reel
          path: |
            reels/kumiko-asanoha/kumiko-asanoha-photo.mp4
            reels/kumiko-asanoha/snapshots/
            reels/kumiko-asanoha/index.html
          if-no-files-found: error
          retention-days: 30
